plugins {
    id 'java'
}

java {
    jar {
        archiveAppendix.set('rdf')
        dependencies {
            implementation project(":data-validator-core")
            implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.17'
            implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-rio-api', version: '5.1.3'
            // Supported formats
            implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-rio-turtle', version: '5.1.3'
            implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-rio-rdfxml', version: '5.1.3'
            implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-rio-ntriples', version: '5.1.3'
            implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-rio-nquads', version: '5.1.3'
            implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-rio-jsonld', version: '5.1.3'
            implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-rio-trig', version: '5.1.3'
            implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-rio-n3', version: '5.1.3'
            implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-rio-rdfjson', version: '5.1.3'
            implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-rio-trix', version: '5.1.3'
            implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-rio-binary', version: '5.1.3'
            implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-rio-hdt', version: '5.1.3'
            //
            implementation group: 'org.apache.jena', name: 'jena-tdb', version: '4.10.0'
            implementation group: 'org.apache.jena', name: 'jena-shacl', version: '5.4.0'
            implementation group: 'com.apicatalog', name: 'titanium-json-ld', version: '1.6.0'
            implementation group: 'org.topbraid', name: 'shacl', version: '1.4.4'
            // Required by titanium-json-ld
            implementation group: 'org.glassfish', name: 'jakarta.json', version: '2.0.1'
        }
    }
}